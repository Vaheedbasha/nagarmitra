services:
  nagarmitra:
    build: .
    ports:
      - "8787:8787"
    environment:
      NODE_ENV: production
      PORT: "8787"
      HOST: 0.0.0.0
      DATABASE_PATH: /app/server/data/nagarmitra.db
      UPLOAD_DIR: /app/server/uploads
      # Set these in a local .env file (never commit it).
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@nagarmitra.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://127.0.0.1:8787}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
    volumes:
      - nagarmitra-data:/app/server/data
      - nagarmitra-uploads:/app/server/uploads
    restart: unless-stopped

volumes:
  nagarmitra-data:
  nagarmitra-uploads:
