services:
  - type: web
    name: nagarmitra
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "8787"
      - key: DATABASE_PATH
        value: /app/server/data/nagarmitra.db
      - key: UPLOAD_DIR
        value: /app/server/uploads
      - key: CORS_ORIGIN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_MODEL
        value: gpt-4o-mini
    disk:
      name: nagarmitra-data
      mountPath: /app/server/data
      sizeGB: 1
